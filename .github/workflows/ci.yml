name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out package
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Check out pinned upstream base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NousResearch/hermes-agent
          ref: 7b761da2de4979e424510ca7022bf9527aa65b68
          path: .source
          fetch-depth: 1
          persist-credentials: false
      - name: Apply Journey patch
        run: python patches/apply.py .source
      - name: Verify resulting tree
        run: |
          test "$(git -C .source rev-parse HEAD)" = "7b761da2de4979e424510ca7022bf9527aa65b68"
          test "$(git -C .source write-tree)" = "8f656cbd8abd015f27268bab5c3f61eb0f742e41"
          git -C .source diff --cached --check
      - name: Run package tests
        run: python -m unittest discover -s tests -v
      - name: Verify package without changing source state
        run: python tests/verify_source.py .source
